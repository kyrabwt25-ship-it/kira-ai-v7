services:
  - type: web
    name: kira-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TOP_MODEL
        value: claude-fable-5-1
      - key: FALLBACK_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PAYMENT_URL_TEMPLATE
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: MANUAL_PAY_NOTE
        sync: false
      - key: VCASH_NUMBER
        sync: false
